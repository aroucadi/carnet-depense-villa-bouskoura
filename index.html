<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Accès Protégé — Villa Bouskoura</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=Schibsted+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0B1230;
    --card: #131C4A;
    --tx: #F4EEDF;
    --mu: #9CA6CE;
    --gold: #FFC233;
    --err: #FF453A;
    --line: rgba(255, 255, 255, 0.12);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(900px 520px at 50% 0%, rgba(79, 107, 255, 0.28), transparent 70%), var(--bg);
    font-family: 'Schibsted Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--tx);
    padding: 20px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 24px;
    padding: 36px 28px;
    width: 100%;
    max-width: 420px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    text-align: center;
  }
  .icon-wrap {
    width: 58px;
    height: 58px;
    margin: 0 auto 20px;
    border-radius: 50%;
    background: rgba(255, 194, 51, 0.12);
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid rgba(255, 194, 51, 0.35);
  }
  .icon-wrap svg {
    width: 28px;
    height: 28px;
    stroke: var(--gold);
  }
  h1 {
    font-family: 'Reem Kufi', sans-serif;
    font-size: 24px;
    margin-bottom: 8px;
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  p {
    font-size: 13.5px;
    color: var(--mu);
    margin-bottom: 24px;
    line-height: 1.5;
  }
  form {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .input-wrap {
    position: relative;
    width: 100%;
  }
  input[type="password"], input[type="text"] {
    width: 100%;
    padding: 14px 44px 14px 16px;
    border-radius: 14px;
    border: 1px solid var(--line);
    background: rgba(11, 18, 48, 0.6);
    color: var(--tx);
    font-size: 15px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  input:focus {
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(255, 194, 51, 0.18);
  }
  .toggle-pwd {
    position: absolute;
    right: 12px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    cursor: pointer;
    color: var(--mu);
    padding: 4px;
    display: flex;
  }
  .toggle-pwd:hover { color: var(--tx); }
  .btn-submit {
    padding: 14px;
    border-radius: 14px;
    border: none;
    background: var(--gold);
    color: #0B1230;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
    font-family: inherit;
    margin-top: 4px;
  }
  .btn-submit:hover { opacity: 0.93; }
  .btn-submit:active { transform: scale(0.98); }
  .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }
  .err {
    display: none;
    font-size: 13px;
    color: var(--err);
    background: rgba(255, 69, 58, 0.12);
    border: 1px solid rgba(255, 69, 58, 0.25);
    border-radius: 10px;
    padding: 9px 12px;
    margin-top: 4px;
    text-align: left;
  }
  .remember {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12.5px;
    color: var(--mu);
    text-align: left;
    cursor: pointer;
    margin-top: 2px;
  }
  .remember input {
    accent-color: var(--gold);
    width: 15px;
    height: 15px;
    cursor: pointer;
  }
</style>
</head>
<body>

<div class="card" id="loginCard">
  <div class="icon-wrap">
    <svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
      <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
    </svg>
  </div>
  <h1>Villa Bouskoura</h1>
  <p>Ce document confidentiel est protégé par chiffrement AES-256. Veuillez entrer le mot de passe pour le consulter.</p>
  
  <form id="authForm">
    <div class="input-wrap">
      <input type="password" id="pwd" placeholder="Mot de passe" autocomplete="current-password" required autofocus>
      <button type="button" class="toggle-pwd" id="toggleBtn" title="Afficher/Masquer">
        <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
      </button>
    </div>
    
    <label class="remember">
      <input type="checkbox" id="rememberMe" checked>
      Se souvenir sur cet appareil
    </label>

    <div id="errMsg" class="err">Mot de passe incorrect ou document altéré.</div>

    <button type="submit" id="subBtn" class="btn-submit">Déverrouiller l'accès</button>
  </form>
</div>

function base64ToBuffer(b64) {
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes;
}

  const key = await crypto.subtle.deriveKey(
    {
      name: 'PBKDF2',
      salt: salt,
      iterations: 100000,
      hash: 'SHA-256'
    },
    keyMaterial,
    { name: 'AES-GCM', length: 256 },
    false,
    ['decrypt']
  );

  const decrypted = await crypto.subtle.decrypt(
    {
      name: 'AES-GCM',
      iv: iv
    },
    key,
    combined
  );

  return new TextDecoder().decode(decrypted);
}

function renderDecrypted(html) {
  document.open();
  document.write(html);
  document.close();
}

async function handleUnlock(e) {
  if (e) e.preventDefault();
  const pwdInput = document.getElementById('pwd');
  const errDiv = document.getElementById('errMsg');
  const btn = document.getElementById('subBtn');
  const remember = document.getElementById('rememberMe').checked;

  errDiv.style.display = 'none';
  btn.disabled = true;
  btn.innerText = 'Déchiffrement...';

  try {
    const html = await decryptPayload(pwdInput.value);
    if (remember) {
      try { localStorage.setItem('vb_auth_token', pwdInput.value); } catch (_) {}
    }
    renderDecrypted(html);
  } catch (err) {
    errDiv.style.display = 'block';
    pwdInput.select();
    btn.disabled = false;
    btn.innerText = "Déverrouiller l'accès";
  }
}

document.getElementById('authForm').addEventListener('submit', handleUnlock);

document.getElementById('toggleBtn').addEventListener('click', function() {
  const pwd = document.getElementById('pwd');
  pwd.type = pwd.type === 'password' ? 'text' : 'password';
});

(async function() {
  try {
    const saved = localStorage.getItem('vb_auth_token');
    if (saved) {
      const html = await decryptPayload(saved);
      renderDecrypted(html);
    }
  } catch (_) {
    localStorage.removeItem('vb_auth_token');
  }
})();
</script>
